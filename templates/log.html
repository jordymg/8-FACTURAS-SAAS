<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log — Facturas SaaS</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 60px;
    background: #0f1115; color: #e5e7eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    max-width: 900px; margin: 0 auto 20px; display: flex;
    align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  h1 { font-size: 18px; margin: 0; color: #f3f4f6; }
  .meta { font-size: 13px; color: #9ca3af; }
  a.refrescar {
    color: #60a5fa; text-decoration: none; font-size: 13px;
    border: 1px solid #374151; padding: 4px 10px; border-radius: 6px;
  }
  a.refrescar:hover { background: #1f2937; }
  ul { list-style: none; margin: 0 auto; padding: 0; max-width: 900px; }
  li {
    background: #171a21; border-left: 3px solid #4b5563;
    border-radius: 6px; padding: 10px 14px; margin-bottom: 8px;
  }
  li.error { border-left-color: #f87171; background: #1f1417; }
  .fila-top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .fecha { font-size: 12px; color: #9ca3af; font-variant-numeric: tabular-nums; }
  .tipo {
    font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
    padding: 2px 7px; border-radius: 999px; background: #263041; color: #93c5fd;
  }
  li.error .tipo { background: #3a1f22; color: #fca5a5; }
  .segmentos { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: #d1d5db; }
  .segmentos span { display: inline-block; margin-right: 14px; }
  .vacio { text-align: center; color: #6b7280; margin-top: 60px; }
</style>
</head>
<body>
  <header>
    <h1>Log de extracción</h1>
    <div class="meta">{{ total }} entradas (últimas {{ total }}) · <a class="refrescar" href="?token={{ token }}">actualizar</a></div>
  </header>
  {% if not entradas %}
    <p class="vacio">Todavía no hay nada registrado.</p>
  {% else %}
  <ul>
    {% for e in entradas %}
    <li class="{{ 'error' if e.es_error else '' }}">
      <div class="fila-top">
        <span class="fecha">{{ e.fecha_hora }}</span>
        <span class="tipo">{{ e.tipo }}</span>
      </div>
      <div class="segmentos">
        {% for s in e.segmentos %}<span>{{ s }}</span>{% endfor %}
      </div>
    </li>
    {% endfor %}
  </ul>
  {% endif %}
</body>
</html>
